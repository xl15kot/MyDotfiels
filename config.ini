[bar/main]
monitor = DVI-0
width = 100%
height = 30
radius = 0
background = #1e1e2e
foreground = #cdd6f4
offset-x = 0
offset-y = 0
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1
font-0 = "JetBrainsMono Nerd Font:size=11;2"
modules-left = arch workspaces
modules-center = window
modules-right = tray time
enable-ipc = true

[module/arch]
type = custom/text
format = 
format-foreground = #1793d1
format-font = 0
click-left = rofi -show drun

[module/workspaces]
type = internal/i3
format = <label-state>
label-focused = %index%
label-focused-foreground = #1e1e2e
label-focused-background = #89b4fa
label-focused-padding = 1
label-unfocused = %index%
label-unfocused-foreground = #cdd6f4
label-unfocused-padding = 1
label-urgent = %index%
label-urgent-foreground = #1e1e2e
label-urgent-background = #f38ba8
label-urgent-padding = 1
label-empty = %index%
label-empty-foreground = #6c7086
label-empty-padding = 1



[module/window]
type = internal/xwindow
format = <label>
label = %title%
label-foreground = #cdd6f4
label-padding = 1
label-maxlen = 80

[module/time]
type = internal/date
interval = 1
date = "%d.%m.%Y"
time = "%H:%M"
label =  %time%  %date%
label-foreground = #cdd6f4
label-padding = 1

[module/tray]
type = internal/tray
format = <tray>
tray-spacing = 6
tray-padding = 1
